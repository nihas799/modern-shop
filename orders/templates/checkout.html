{% extends 'base.html' %}
{% block content %}

<div class="container my-5">
    <h2 class="mb-4 fw-bold">Checkout</h2>

    <!-- CART ITEMS -->
    <table class="table align-middle mb-4">
        <thead class="table-light">
            <tr>
                <th>Product</th>
                <th>Qty</th>
                <th class="text-end">Price</th>
            </tr>
        </thead>
        <tbody>
{% for item in items %}
<tr>
    <td>{{ item.product }}</td>
    <td>{{ item.quantity }}</td>
    <td>₹ {{ item.total_price }}</td>
</tr>
{% empty %}
<tr>
    <td colspan="3" class="text-center text-muted">
        No items to checkout
    </td>
</tr>
{% endfor %}
</tbody>

    </table>

    <h4 class="fw-bold mb-4">
        Total: ₹ {{ cart.get_total_price }}
    </h4>

    <!-- CHECKOUT FORM -->
    <form method="post">
        {% csrf_token %}

        <!-- PAYMENT METHOD -->
        <div class="mb-4">
            <label class="form-label fw-semibold">Payment Method</label>
            <select name="payment_method" class="form-select" required>
            <option value="">Select payment method</option>
            <option value="cod">Cash on Delivery</option>
            <option value="online">Online Payment</option>
        </select>
        </div>

        <!-- DELIVERY ADDRESS -->
        <h5 class="mb-3 fw-semibold">Delivery Address</h5>

        <input type="text" name="full_name" class="form-control mb-2"
               placeholder="Full Name" required>

        <input type="text" name="phone" class="form-control mb-2"
               placeholder="Phone Number" required>

        <textarea name="address_line" class="form-control mb-2"
                  placeholder="House / Street / Area" required></textarea>

        <div class="row">
            <div class="col-md-6">
                <input type="text" name="city" class="form-control mb-2"
                       placeholder="City" required>
            </div>
            <div class="col-md-6">
                <input type="text" name="post_office" class="form-control mb-2"
                       placeholder="Post Office" required>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <input type="text" name="state" class="form-control mb-2"
                       placeholder="State" required>
            </div>
            <div class="col-md-6">
                <input type="text" name="pincode" class="form-control mb-2"
                       placeholder="Pincode" required>
            </div>
        </div>

        <!-- SUBMIT -->
        <button type="submit" class="btn btn-success btn-lg w-100">
            Place Order
        </button>
    </form>
</div>

{% endblock %}
